name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pyyaml numpy pillow scipy
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Lint skills
        run: python3 tools/lint-skills.py

      # Every shipped script's selftest that this runner can run (stdlib, numpy, Pillow,
      # SciPy, ffmpeg). Rows needing Blender, torch or OpenCV print SKIP; run those locally.
      - name: Script selftests
        run: python3 tools/run-selftests.py

      # What one skill writes and another reads (schemas/), the flags and -executeMethod
      # entries the docs name, declared cross-skill paths, and version tokens (VERSIONS.md).
      - name: Data contracts
        run: |
          pip install jsonschema
          python3 tools/check-contracts.py

      # Where exit 2 means "a gate failed", argparse's own exit 2 on a bad flag would read
      # as a verdict. These scripts exit 1 on a usage error instead; each must say so.
      - name: Usage errors are not gate failures
        run: |
          python3 - <<'PY'
          import importlib.util, os, subprocess, sys
          SCRIPTS = {   # path: modules it imports before parsing its arguments
              'blender-retarget/scripts/motion_metrics.py': ['numpy'],
              'blender-retarget/scripts/clip_metrics.py': ['numpy'],
              'character-autorig/scripts/arp_markers.py': ['numpy'],
              'character-autorig/scripts/autorig.py': [],
              'character-autorig/scripts/deform_gate.py': ['numpy'],
              'character-autorig/scripts/mesh_check.py': ['numpy'],
              'codex-visual/scripts/audit_pixel.py': ['numpy', 'PIL'],
              'codex-visual/scripts/breathe.py': ['numpy', 'PIL'],
              'codex-visual/scripts/key_unmix.py': ['numpy', 'PIL'],
              'codex-visual/scripts/pick_key.py': ['numpy', 'PIL'],
              'codex-visual/scripts/sheet_to_frames.py': ['PIL'],
              'comfyui-asset-generation/scripts/layout_map.py': ['numpy', 'PIL'],
              'humanoid-motion/scripts/contact_bake.py': ['numpy'],
              'humanoid-motion/scripts/twocam/detect.py': ['numpy'],
              'humanoid-motion/scripts/twocam/exam.py': ['numpy'],
              'humanoid-motion/scripts/twocam/film.py': [],
              'humanoid-motion/scripts/twocam/layout.py': ['numpy'],
              'humanoid-motion/scripts/twocam/make_prompt.py': [],
              'humanoid-motion/scripts/twocam/skeleton.py': ['numpy'],
              'humanoid-motion/scripts/twocam/solve.py': ['numpy'],
              'humanoid-motion/scripts/twocam/train.py': ['numpy'],
              'humanoid-motion/scripts/twocam/twocam.py': [],
              'mesh-texture-paint/scripts/mvtex.py': ['numpy', 'PIL', 'scipy'],
              'mesh-texture-paint/scripts/paint_loop.py': ['numpy', 'PIL', 'scipy'],
              'mesh-texture-paint/scripts/qwen_paint.py': [],
              'sprite-from-video/scripts/video_canvas.py': ['numpy', 'PIL'],
              'sprite-from-video/scripts/video_frames.py': ['numpy', 'PIL'],
              'sprite-from-video/scripts/video_loop.py': ['numpy', 'PIL'],
              'unity-new-project/scripts/pure_tests.py': [],
              'unity-profiling/scripts/compare_windows.py': [],
              'unity-rigged-character/scripts/contract_map.py': ['numpy'],
          }
          bad = ran = 0
          for path, mods in SCRIPTS.items():
              if any(importlib.util.find_spec(m) is None for m in mods):
                  print(f'SKIP (missing dep) {path}'); continue
              ran += 1
              r = subprocess.run([sys.executable, 'skills/' + path, '--no-such-flag'],
                                 capture_output=True, text=True, timeout=120)
              out = r.stdout + r.stderr
              # exit 1, and from the argument parser: a crash on import also exits 1
              if r.returncode != 1 or 'Traceback' in out:
                  bad += 1
                  print(f'FAIL {path}: --no-such-flag exited {r.returncode}\n{out[-600:]}')
              else:
                  print(f'ok   {path}: exit 1')
          print(f'{ran} scripts probed, {bad} failed')
          sys.exit(1 if bad or not ran else 0)
          PY

      # C# rules the Unity compiler only reports inside a project: class name equals file
      # name, UnityEditor only under Editor/ or #if UNITY_EDITOR, no new global types.
      - name: C# static rules
        run: python3 tools/check-csharp.py

      # The Codex manifests are generated. If regenerating them changes anything,
      # someone hand-edited a generated file or forgot to run the sync.
      - name: Codex manifests are in sync
        run: |
          python3 tools/sync-codex-manifests.py
          git diff --exit-code -- .codex-plugin .agents

      # Two facts this repo writes down twice: the plugin's identity (both
      # manifests carry it) and which sibling plugins a skill may route to.
      # Nothing else notices when only one copy moves.
      - name: Manifests and companions are consistent
        run: python3 tools/check-consistency.py

      # The asset registry's selftests and negative fixtures, the default 3D
      # budget table in one place only, and no fixed triangle budgets left.
      - name: Registry and budgets gate
        run: python3 tools/check-registry.py

      - name: Manifests are valid JSON
        run: |
          python3 - <<'PY'
          import json
          for p in ['.claude-plugin/plugin.json', '.claude-plugin/marketplace.json',
                    '.codex-plugin/plugin.json', '.agents/plugins/marketplace.json']:
              json.load(open(p))
          print('all manifests parse')
          PY

      # A translation that has drifted from the source is worse than no translation:
      # it states, in a language the reader trusts, something that is no longer true.
      # Cheapest reliable signal — every README must describe the same set of skills.
      - name: Translated READMEs cover the same skills
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          files = {'README.md': pathlib.Path('README.md')}
          for f in sorted(pathlib.Path('.github').glob('README.*.md')):
              files[str(f)] = f
          names = {d.name for d in pathlib.Path('skills').iterdir() if d.is_dir()}
          bad = False
          for label, f in files.items():
              txt = f.read_text(encoding='utf-8')
              found = {m for m in re.findall(r'`([a-z][a-z0-9-]+)`', txt) if m in names}
              missing, extra = names - found, found - names
              if missing or extra:
                  bad = True
                  print(f'{label}: missing={sorted(missing)} unknown={sorted(extra)}')
              else:
                  print(f'{label}: all {len(names)} skills present')
          sys.exit(1 if bad else 0)
          PY

      # Every skill a SKILL.md names must exist, and the name must match its directory.
      - name: No dangling reference links
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path('skills')
          names = {d.name for d in root.iterdir() if d.is_dir()}
          # A cross-skill pointer is written `skill` → `reference/x.md`; it is checked
          # against the named skill. A bare `reference/x.md` is checked against its own skill.
          arrow = re.compile(r'`([a-z0-9-]+)`\s*(?:→|->)\s*`(reference/[a-z0-9-]+\.md)`')
          bare = re.compile(r'`(reference/[a-z0-9-]+\.md)`')
          missing = []
          for sk in root.iterdir():
              if not sk.is_dir(): continue
              for f in sk.rglob('*.md'):
                  txt = f.read_text(encoding='utf-8')
                  for skill, r in set(arrow.findall(txt)):
                      if skill not in names or not (root / skill / r).exists():
                          missing.append(f'{f} -> {skill} {r}')
                  rest = arrow.sub('', txt)
                  for r in set(bare.findall(rest)):
                      if not (sk / r).exists():
                          missing.append(f'{f} -> {r}')
          if missing:
              print('\n'.join(missing)); sys.exit(1)
          print(f'{len(names)} skills, no dangling reference links')
          PY
